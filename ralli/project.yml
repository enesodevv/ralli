name: Ralli
options:
  developmentLanguage: en
  knownRegions: [en, tr, es, de, fr, it]
  bundleIdPrefix: com.ralli
  deploymentTarget:
    iOS: '17.0'
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1'
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_CFBundleDisplayName: Ralli
    INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
    INFOPLIST_KEY_UIRequiresFullScreen: YES
    INFOPLIST_KEY_NSMicrophoneUsageDescription: "Use the microphone to dictate your lesson notes."
    INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Turn your speech into lesson notes in your app language."
    CODE_SIGN_STYLE: Automatic
    # DEVELOPMENT_TEAM comes from Config/Signing.local.xcconfig (gitignored); see Config/Signing.xcconfig.
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 1
    INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
    INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.sports
targets:
  Ralli:
    type: application
    platform: iOS
    sources: [Ralli]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.enesodev.Ralli
  RalliUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: Ralli
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Ralli
  RalliPersistenceTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: '14.0'
    sources:
      - Tests
      - Ralli/Core/Localization/L10n.swift
      - Ralli/Core/Models/PlayerStore.swift
      - Ralli/Core/Models/PracticePlan.swift
      - Ralli/Core/Models/PlayerContext.swift
      - Ralli/Core/Models/NoteDraft.swift
      - Ralli/Core/Models/CourtPattern.swift
      - Ralli/Core/Models/StrokeMotion.swift
      - Ralli/Core/Persistence/PlayerArchive.swift
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
schemes:
  Ralli:
    build:
      targets:
        Ralli: all
    run:
      config: Debug
      debugEnabled: false
  RalliPersistenceTests:
    build:
      targets:
        RalliPersistenceTests: all
    test:
      targets:
        - RalliPersistenceTests
  Ralli-AccessibilityQA:
    build:
      targets:
        Ralli: all
    run:
      config: Debug
      debugEnabled: false
      commandLineArguments:
        "-ralli-accessibility-qa": true
  RalliUITests:
    build:
      targets:
        Ralli: all
        RalliUITests: [test]
    test:
      targets:
        - RalliUITests
